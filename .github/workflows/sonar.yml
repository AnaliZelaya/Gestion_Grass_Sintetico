name: Análisis estático (SonarCloud + PMD/Checkstyle/SpotBugs)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  static-analysis:
    name: Análisis de calidad de código
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: bd_grass_sintetico
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar + cobertura JaCoCo
        run: mvn -B verify -DskipITs

      - name: Herramientas complementarias (PMD / Checkstyle / SpotBugs)
        if: always()
        run: mvn -B pmd:pmd pmd:cpd checkstyle:checkstyle spotbugs:check -DskipTests

      - name: SonarCloud Scan
        run: mvn -B sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Subir reportes como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            target/pmd.xml
            target/cpd.xml
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/site/jacoco/
            target/sonar/report-task.txt
          retention-days: 30

sonar.organization=analizelaya
sonar.projectKey=AnaliZelaya_Gestion_Grass_Sintetico
sonar.projectName=Gestion Grass Sintetico - Backend
sonar.projectVersion=0.0.1

# Codificación y alcance
sonar.sourceEncoding=UTF-8
sonar.java.source=17
sonar.sources=src/main/java

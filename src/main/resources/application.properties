spring.application.name=grass-backend

# ===============================
# NOMBRE DE LA APLICACIÓN
# ===============================
spring.application.name=grass-backend

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ===============================
# La URL conecta con tu base de datos local "bd_grass_sintetico"
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_grass_sintetico
spring.datasource.username=postgres
spring.datasource.password=admin123

# ===============================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===============================
# "validate" asegura que Spring use las tablas que ya creaste en Beekeeper
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Muestra las consultas SQL en la consola para facilitar el desarrollo
spring.jpa.show-sql=true

# Permitir subir fotos más pesadas
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
# El backend correrá en el puerto 8080
server.port=8080